name: update-leaderboard

# Добавить разрешения в начало файла
permissions:
  contents: write
  actions: read

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Использовать токен с правами записи
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Clean old results
      run: |
        # Удалить проблемные файлы
        rm -f results/result.json results/results.json results/unknown.json
        mkdir -p results
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install C++ dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Configure CMake
      run: cmake -B build

    - name: Build project
      run: cmake --build build

    - name: Run sorting tests
      run: |
        ./build/run github_runner_quicksort
        ./build/run github_runner_mergesort
        ./build/run github_runner_heapsort
        echo "Generated results:"
        ls -l results/

    - name: Install Python dependencies
      run: pip install matplotlib numpy python-dateutil tabulate

    - name: Run validation
      run: |
        python3 result_checker.py || echo "Validation errors detected"

    - name: Generate leaderboard
      run: python3 leaderboard.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Update leaderboard $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push
