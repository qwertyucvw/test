name: Generate Leaderboard Image

on:
  push:
    paths:
      - 'LEADERBOARD.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pil python3-pil.imagetk
        pip install pillow

    - name: Generate image
      run: |
        python leaderboard_generator.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add leaderboard.png
        git commit -m "Auto-generated leaderboard image [skip ci]" || echo "No changes to commit"
        git push
