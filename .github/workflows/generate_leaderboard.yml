name: Generate Leaderboard Image

on:
  push:
    paths:
      - 'LEADERBOARD.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow
    
    - name: Generate leaderboard image
      run: |
        python leaderboard_generator.py
        
    - name: Commit and push if image changed
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add leaderboard_*.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated leaderboard image [skip ci]" && git push)
