name: Update Leaderboard Image

on:
  push:
    paths:
      - 'LEADERBOARD.md'
  schedule:
    - cron: '0 0 * * *'  # Каждый день в полночь
  workflow_dispatch:

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pil
        pip install pillow

    - name: Generate leaderboard image
      run: |
        python << 'EOF'
        from PIL import Image, ImageDraw, ImageFont
        import re

        def generate_image():
            try:
                with open('LEADERBOARD.md', 'r', encoding='utf-8') as f:
                    content = f.read()
                
                # Ищем начало таблицы
                table_start = content.find('Rank | Username | Total Time (s)')
                if table_start == -1:
                    raise ValueError("Не найдена таблица лидеров")
                
                # Извлекаем строки таблицы
                table_lines = [line.strip() for line in content[table_start:].split('\n') 
                             if line.strip() and '|' in line and '----' not in line][:10]  # Берем первые 10 записей
                
                if len(table_lines) < 2:
                    raise ValueError("Недостаточно данных в таблице")
                
                # Обрабатываем данные
                headers = [h.strip() for h in table_lines[0].split('|')]
                data = []
                for line in table_lines[1:]:
                    parts = [p.strip() for p in line.split('|')]
                    if len(parts) >= 3:  # Нужны минимум Rank, Username, Time
                        data.append({
                            'rank': parts[0],
                            'username': parts[1],
                            'time': parts[2] + 's' if parts[2] else ''
                        })
                
                # Создаем изображение
                width = 600
                row_height = 50
                header_height = 70
                img_height = header_height + len(data) * row_height
                
                img = Image.new('RGB', (width, img_height), (245, 245, 245))
                draw = ImageDraw.Draw(img)
                
                try:
                    font = ImageFont.truetype("DejaVuSans.ttf", 22)
                    bold_font = ImageFont.truetype("DejaVuSans-Bold.ttf", 24)
                except:
                    font = ImageFont.load_default()
                    bold_font = font
                
                # Рисуем заголовок
                draw.rectangle([0, 0, width, header_height], fill=(30, 100, 180))
                draw.text((50, header_height/2), "Rank", font=bold_font, fill='white', anchor='lm')
                draw.text((200, header_height/2), "Username", font=bold_font, fill='white', anchor='lm')
                draw.text((450, header_height/2), "Time", font=bold_font, fill='white', anchor='lm')
                
                # Рисуем данные
                for i, entry in enumerate(data):
                    y = header_height + i * row_height
                    fill = (255, 255, 255) if i % 2 == 0 else (235, 245, 255)
                    
                    draw.rectangle([0, y, width, y + row_height], fill=fill)
                    draw.text((50, y + row_height/2), entry['rank'], font=font, fill='black', anchor='lm')
                    draw.text((200, y + row_height/2), entry['username'], font=font, fill='black', anchor='lm')
                    draw.text((450, y + row_height/2), entry['time'], font=font, fill='black', anchor='lm')
                
                img.save('leaderboard.png')
                print("Изображение успешно создано")
            
            except Exception as e:
                print(f"Ошибка: {str(e)}")
                # Создаем изображение с ошибкой
                img = Image.new('RGB', (600, 100), (255, 230, 230))
                draw = ImageDraw.Draw(img)
                draw.text((300, 40), "Ошибка генерации таблицы лидеров", fill='red', 
                         font=ImageFont.load_default(size=20), anchor='mm')
                draw.text((300, 70), str(e), fill='red', 
                         font=ImageFont.load_default(size=16), anchor='mm')
                img.save('leaderboard.png')

        generate_image()
        EOF

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add leaderboard.png
        git commit -m "Обновление таблицы лидеров [skip ci]" || echo "Нет изменений для коммита"
        git push
